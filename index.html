<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>CHINA ABDULAZIZ</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header class="main-header">
      <div class="logo">CHINA ABDULAZIZ</div>

      <div class="header-buttons">
        <button id="themeBtn" type="button">🌙</button>

        <button id="favoriteBtn" type="button">
          ❤️
          <span id="favoriteCount">0</span>
        </button>

        <button id="cartBtn" type="button">
          🛒
          <span id="cartCount">0</span>
        </button>
      </div>
    </header>

    <!-- QIDIRUV VA KATEGORIYALAR -->
    <section class="top-area">
      <div class="search-box">
        <input
          id="searchInput"
          type="text"
          placeholder="🔎 Mahsulot qidirish..."
        />

        <button id="clearSearch" type="button">×</button>
      </div>

      <div class="categories">
        <button class="category active" data-category="all" type="button">
          🛍 Barchasi
        </button>

        <button class="category" data-category="erkaklar" type="button">
          👕 Erkaklar
        </button>

        <button class="category" data-category="oyoq-kiyim" type="button">
          👟 Oyoq kiyim
        </button>

        <button class="category" data-category="koz-oynak" type="button">
          🕶 Ko‘zoynak
        </button>

        <button class="category" data-category="bosh-kiyim" type="button">
          🧢 Bosh kiyim
        </button>
      </div>

      <!-- FILTR VA SARALASH -->
      <div class="tools">
        <button id="filterBtn" type="button">⚙️ Filtrlar</button>

        <select id="sortSelect">
          <option value="default">Saralash</option>

          <option value="cheap">Arzon → Qimmat</option>

          <option value="expensive">Qimmat → Arzon</option>

          <option value="name">Nom bo‘yicha</option>
        </select>
      </div>

      <!-- FILTR PANELI -->
      <div id="filterPanel" class="filter-panel hidden">
        <input id="minPrice" type="number" placeholder="Minimal narx" />

        <input id="maxPrice" type="number" placeholder="Maksimal narx" />

        <button id="applyFilter" type="button">✓ Qo‘llash</button>

        <button id="resetFilter" type="button">↻ Tozalash</button>
      </div>
    </section>

    <!-- MAHSULOTLAR -->
    <main class="products-section">
      <div class="products-title">
        <h2>Mahsulotlar</h2>

        <strong id="productCount"> 0 ta mahsulot </strong>
      </div>

      <div id="products"></div>

      <!-- MAHSULOT YO‘Q -->
      <div id="empty" class="empty hidden">
        <div>🔍</div>

        <h2>Mahsulot topilmadi</h2>

        <p>Boshqa mahsulot qidirib ko‘ring.</p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <h2>CHINA ABDULAZIZ</h2>

      <p>Sifatli mahsulotlar • Qulay narxlar</p>

      <a href="https://t.me/abdulazizsobitov" target="_blank">
        ✈️ Telegram kanal
      </a>
    </footer>

    <!-- DATABASE -->
    <script src="database.js"></script>

    <!-- ASOSIY JAVASCRIPT -->
    <script src="app.js"></script>
  </body>
</html>
